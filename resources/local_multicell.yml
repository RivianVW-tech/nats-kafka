services:
  zookeeper:
    # Only Kafka talks to Zookeeper, over the compose network; no host port
    # is published so a busy local 2181 cannot break the environment.
    image: wurstmeister/zookeeper
  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_ADVERTISED_HOST_NAME: localhost
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
  nats-cell-a:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--server_name", "cell-a"]
    ports:
      - "4222:4222"
      - "8222:8222"
  nats-cell-b:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--server_name", "cell-b"]
    ports:
      - "4223:4222"
      - "8223:8222"
