#
# Scale-out variant of the local multicell validation config.
# Two filtered JetStreamToKafka connectors per cell (4 total):
# telemetry.a.> and telemetry.b.> on cell-a (default cluster) and
# telemetry.n.> and telemetry.o.> on cell-b.
# Pairs with `resources/publish_dummy_telemetry.sh bench <msgs> <size> <clients> 2`,
# which limits the bench subject spread to the same 2 letters per cell so
# no messages land on subjects without a consumer. See HOWTO.md.
#
# Keep the connector count moderate: every connector adds a JetStream
# consumer and a Kafka producer connection, and a large count can
# overwhelm a laptop docker VM.
#
# Monitoring runs on 9223 so this config never collides with the basic
# two-connector bridge on 9222; still, run only one bridge at a time or
# both will consume the streams and double-write the topic.
#

reconnectinterval: 5000,
connecttimeout: 5000,

logging: {
  time: true,
  debug: false,
  trace: false,
  colors: true,
  pid: false,
}

monitoring: {
  httpport: 9223,
}

nats: {
  Servers: ["nats://localhost:4222"],
  ConnectTimeout: 5000,
  MaxReconnects: -1,
  ReconnectWait: 5000,
}

natsclusters: [
  {
    name: "cell-b",
    servers: ["nats://localhost:4223"],
  },
]

jetstream: {
  maxwait: 5000,
}

connect: [
  {
      type: "JetStreamToKafka",
      brokers: ["localhost:9192"],
      id: "TelemetryCellA-a",
      topic: "brand.telemetry",
      subject: "telemetry.a.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-a-a",
      balancer: "leastbytes",
  },
  {
      type: "JetStreamToKafka",
      brokers: ["localhost:9192"],
      id: "TelemetryCellA-b",
      topic: "brand.telemetry",
      subject: "telemetry.b.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-a-b",
      balancer: "leastbytes",
  },
  {
      type: "JetStreamToKafka",
      natsconnection: "cell-b",
      brokers: ["localhost:9192"],
      id: "TelemetryCellB-n",
      topic: "brand.telemetry",
      subject: "telemetry.n.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-b-n",
      balancer: "leastbytes",
  },
  {
      type: "JetStreamToKafka",
      natsconnection: "cell-b",
      brokers: ["localhost:9192"],
      id: "TelemetryCellB-o",
      topic: "brand.telemetry",
      subject: "telemetry.o.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-b-o",
      balancer: "leastbytes",
  },
],
