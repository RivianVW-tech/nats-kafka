#
# Scale-out variant of the local multicell validation config.
# One filtered JetStreamToKafka connector per bench subject letter:
# telemetry.a.> through telemetry.m.> on cell-a (default cluster) and
# telemetry.n.> through telemetry.z.> on cell-b, 26 connectors total.
# Pairs with `resources/publish_dummy_telemetry.sh bench`, which spreads
# load over the same subject space. See HOWTO.md.
#
# Monitoring runs on 9223 so this config never collides with the basic
# two-connector bridge on 9222; still, run only one bridge at a time or
# both will consume the streams and double-write the topic.
#

reconnectinterval: 5000,
connecttimeout: 5000,

logging: {
  time: true,
  debug: false,
  trace: false,
  colors: true,
  pid: false,
}

monitoring: {
  httpport: 9223,
}

nats: {
  Servers: ["nats://localhost:4222"],
  ConnectTimeout: 5000,
  MaxReconnects: -1,
  ReconnectWait: 5000,
}

natsclusters: [
  {
    name: "cell-b",
    servers: ["nats://localhost:4223"],
  },
]

jetstream: {
  maxwait: 5000,
}

connect: [
  {
      type: "JetStreamToKafka",
      brokers: ["localhost:9192"],
      id: "TelemetryCellA-a",
      topic: "brand.telemetry",
      subject: "telemetry.a.>",
      stream: "TELEMETRY",
      durablename: "nats-kafka-cell-a-a",
      balancer: "leastbytes",
  },
  {
      type: "JetStreamToKafka",
      brokers: ["localhost:9192"],
